<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archisman's Website</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap");
      body {
        /* background: url("https://picsum.photos/id/237/200/300"); */
        /* background-repeat: no-repeat; */
        margin: 0;
        padding: 0;
        background: url("https://mir-s3-cdn-cf.behance.net/project_modules/disp/1c8d4d29940709.560b8162bdfd0.gif") no-repeat center center fixed;
        background-size: cover;
      }

      h1 {
        font-family: "Caacupe One", sans-serif;
        font-size: 50px;
        color: #80ff00;
        width: 100%;
        text-align: center;
        /* animation:  slowbounce 2s infinite alternate; */
        transform : translateY(230%);
        text-shadow: 2px 2px 10px #80ff00c7;
      }

      @keyframes slowbounce {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(0);
        }
      }

      img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        object-position: bottom;
        border-radius: 100%;
      }
      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="https://ik.imagekit.io/metaborong/picture.jpeg" alt="My Picture" />
      <h1>Hi I am Archisman, welcome to My Page</h1>
    </div>
  </body>
</html>
